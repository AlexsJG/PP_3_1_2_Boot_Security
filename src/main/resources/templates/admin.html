<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>
  <style>
    body { font-family: Arial,serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #4CAF50; color: white; }
    .logout-form { position: absolute; top: 20px; right: 20px; }
    .logout-btn { background: #f44336; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 3px; }
    .btn { padding: 5px 10px; margin: 0 2px; border: none; cursor: pointer; border-radius: 3px; }
    .btn-edit { background-color: #2196F3; color: white; }
    .btn-delete { background-color: #f44336; color: white; }
    .footer-buttons { display: flex; align-items: center; margin-top: 20px; gap: 10px; }

    /* Единый стиль для всех больших кнопок в футере */
    .footer-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      line-height: normal;
      box-sizing: border-box;
    }

    .btn-add {
      background-color: #4CAF50;
      color: white;
    }

    .btn-profile {
      background-color: #2196F3;
      color: white;
    }

    .btn-add:hover, .btn-profile:hover {
      opacity: 0.9;
    }

    /* Стили для заголовка с информацией о пользователе в одну строку */
    .header-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
    }

    .user-info-inline {
      background-color: #e8f5e8;
      padding: 8px 15px;

      border-left: 4px solid #4CAF50;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
    }

    .user-info-inline .label {
      font-weight: bold;
      color: #2e7d32;
    }

    .user-info-inline .email {
      color: #1976D2;
      font-weight: 500;
    }

    .user-info-inline .roles-container {
      color: #7b1fa2;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .user-info-inline .separator {
      color: #4CAF50;
      font-weight: bold;
      margin: 0 5px;
    }
  </style>
</head>
<body>
<div class="logout-form">
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="logout-btn">Logout</button>
  </form>
</div>

<div class="header-container">
  <h1>Admin Panel</h1>

  <!-- Информация о текущем пользователе в одну строку -->
  <div class="user-info-inline" th:if="${currentUser != null}">
    <span class="label">Logged in:</span>
    <span class="email" th:text="${currentUser.email}">admin@mail.ru</span>
    <span class="separator">|</span>
    <span class="label">Roles:</span>
    <!-- ИСПРАВЛЕНО: перебираем роли в цикле и объединяем через запятую -->
    <span class="roles-container">
      <th:block th:each="role, iterStat : ${currentUser.roles}">
        <span th:text="${role.role}"></span><span th:if="${!iterStat.last}">, </span>
      </th:block>
    </span>
  </div>
</div>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Age</th>
    <th>Email</th>
    <th>Roles</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.firstName}"></td>
    <td th:text="${user.lastName}"></td>
    <td th:text="${user.age}"></td>
    <td th:text="${user.email}"></td>
    <td>
      <span th:each="role : ${user.roles}" th:text="${role.role} + ' '"></span>
    </td>
    <td>
      <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-edit">Edit</a>
      <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-delete">Delete</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<!-- Кнопки внизу: Add New User и View My Profile в одном ряду -->
<div class="footer-buttons">
  <button class="footer-btn btn-add" onclick="window.location.href='/admin/new'">Add New User</button>
  <a href="/user" class="footer-btn btn-profile">View My Profile</a>
</div>

</body>
</html>
