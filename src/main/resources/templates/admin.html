<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* (стили*/
        body {
            background-color: #f5f5f5;
        }

        .left-sidebar {
            background-color: white;
            min-height: calc(100vh - 56px);
            padding: 40px 0 20px 0;
        }

        .nav-pills {
            width: 100%;
        }

        .nav-pills .nav-link {
            background-color: transparent;
            color: #495057;
            margin-bottom: 0;
            text-align: left;
            padding: 12px 20px;
            border-radius: 0;
            width: 100%;
            transition: all 0.2s;
        }

        .nav-pills .nav-link.active {
            background-color: #0d6efd !important;
            color: white;
            border-radius: 0;
        }

        .nav-pills .nav-link:hover:not(.active) {
            background-color: #e9ecef;
            border-radius: 0;
        }

        .right-content {
            background-color: #f5f5f5;
            min-height: calc(100vh - 56px);
            padding: 50px;
        }

        .custom-tabs {
            border-bottom: 1px solid #dee2e6;
        }

        .custom-tabs .nav-link {
            border: none;
            background-color: transparent !important;
            padding: 10px 15px;
            margin-right: 5px;
        }

        .custom-tabs .nav-link.active {
            background-color: white !important;
            color: black !important;
            border: 1px solid #dee2e6;
            border-bottom-color: white;
            border-radius: 4px 4px 0 0;
        }

        .custom-tabs .nav-link:not(.active) {
            color: #0d6efd !important;
            border: none !important;
        }

        .custom-tabs .nav-link:not(.active):hover {
            color: #0a58ca !important;
        }

        .custom-table {
            border: 1px solid #dee2e6 !important;
            background-color: white;
            border-collapse: collapse;
            width: 100%;
        }

        .custom-table th, .custom-table td {
            border: none;
            padding: 12px 8px;
            vertical-align: middle;
        }

        .custom-table thead th {
            border-bottom: 2px solid #dee2e6;
            background-color: white;
        }

        .custom-table tbody tr {
            border-bottom: 1px solid #f0f0f0;
        }

        .user-table .custom-table tbody tr:nth-child(odd) td,
        .user-profile-table .custom-table tbody tr:nth-child(odd) td {
            background-color: #f8f9fa;
        }

        .table-caption-cell {
            padding: 12px 15px 0 15px !important;
            border-bottom: none !important;
        }

        .caption-content h4 {
            margin: 0 0 12px 0;
            font-weight: 500;
            color: #212529;
        }

        .thin-divider {
            width: calc(100% - 15px);
            margin: 0 auto;
            border-top: 1px solid #dee2e6;
        }

        .user-table .table-caption-cell, .user-profile-table .table-caption-cell, .new-user-table .table-caption-cell {
            background-color: #e9ecef;
        }

        .user-profile-table .thin-divider, .new-user-table .thin-divider {
            width: 100% !important;
        }

        .new-user-table .custom-table tbody tr {
            border-bottom: none !important;
        }

        .new-user-table .custom-table tbody tr:nth-child(odd) td {
            background-color: transparent !important;
        }

        .new-user-table .custom-table tbody td {
            padding: 6px 8px !important;
        }

        .content-block {
            max-width: 95%;
            margin: 0 auto;
        }

        .no-gap {
            margin-top: 0 !important;
        }

        .form-field-cell {
            text-align: center;
        }

        .form-field-cell label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #212529;
        }

        .form-field-cell input, .form-field-cell select {
            width: 50%;
            margin: 0 auto;
            display: inline-block;
        }

        @media (min-width: 768px) {
            .form-field-cell input, .form-field-cell select {
                width: 40%;
            }
        }

        .new-user-table .form-field-cell label {
            font-size: 1.1rem;
        }

        .new-user-table .btn-success {
            font-size: 1.1rem;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .new-user-table select[name="roles"] {
            height: 70px;
            min-height: 70px;
        }

        .new-user-table select[multiple] {
            height: 70px;
        }

        .logout-btn-custom {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
        }

        .logout-btn-custom:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .left-sidebar .nav {
            flex-direction: column;
        }

        .modal-field-cell {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-field-cell label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #212529;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal-field-cell input, .modal-field-cell select {
            width: 70%;
            margin: 0 auto;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.95rem;
            display: block;
        }

        .modal-field-cell select[multiple] {
            height: 70px;
            min-height: 70px;
        }

        .modal-field-cell small {
            display: block;
            margin-top: 5px;
            text-align: center;
        }

        .modal-dialog {
            max-width: 500px;
        }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="p-3 bg-dark text-white d-flex justify-content-between align-items-center">
        <div>
            <span class="fw-bold fs-4" th:text="${currentUser != null ? currentUser.email : 'admin@email.com'}">admin@email.com</span>
            <span class="fs-4"> with roles:</span>
            <span th:if="${currentUser != null and currentUser.roles != null}" class="ms-2 fs-4">
        <th:block th:each="role, iterStat : ${currentUser.roles}">
          <span th:text="${role.role.replace('ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
        </th:block>
      </span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-link p-0 fw-bold fs-5 logout-btn-custom">Logout</button>
        </form>
    </div>
</div>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-3 left-sidebar">
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
                <button class="nav-link active" id="v-pills-home-tab" data-bs-toggle="pill"
                        data-bs-target="#v-pills-home" type="button" role="tab">Admin
                </button>
                <button class="nav-link" id="v-pills-profile-tab" data-bs-toggle="pill"
                        data-bs-target="#v-pills-profile" type="button" role="tab">User
                </button>
            </div>
        </div>

        <div class="col-md-9 right-content">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="v-pills-home">
                    <div class="content-block">
                        <h3 class="fw-bold mb-4" style="font-size: 2.5rem;">Admin panel</h3>
                    </div>

                    <ul class="nav custom-tabs content-block" id="adminTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="user-table-tab" data-bs-toggle="tab"
                                    data-bs-target="#user-table" type="button" role="tab">User Table
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user"
                                    type="button" role="tab">New User
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Таблица пользователей -->
                        <div class="tab-pane fade show active user-table" id="user-table" role="tabpanel">
                            <div class="content-block no-gap">
                                <table class="custom-table">
                                    <thead>
                                    <tr>
                                        <th colspan="8" class="table-caption-cell">
                                            <div class="caption-content"><h4 class="mb-2">All users</h4>
                                                <div class="thin-divider"></div>
                                            </div>
                                        </th>
                                    </tr>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Roles</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.firstName}"></td>
                                        <td th:text="${user.lastName}"></td>
                                        <td th:text="${user.age}">25</td>
                                        <td th:text="${user.email}"></td>
                                        <td>
                                            <th:block th:each="role, iterStat : ${user.roles}">
                                                <span th:text="${role.role.replace('ROLE_', '')}"></span><span
                                                    th:if="${!iterStat.last}">, </span>
                                            </th:block>
                                        </td>
                                        <td>
                                            <!-- Скрытый элемент с ID ролей для редактирования -->
                                            <span th:id="'editRolesIds_' + ${user.id}" style="display: none;">
                          <th:block th:each="role, iterStat : ${user.roles}">
                            <span th:text="${role.id}"></span><span th:if="${!iterStat.last}">,</span>
                          </th:block>
                        </span>
                                            <button type="button" class="btn btn-sm btn-primary edit-btn"
                                                    th:data-id="${user.id}"
                                                    th:data-firstname="${user.firstName}"
                                                    th:data-lastname="${user.lastName}"
                                                    th:data-age="${user.age}"
                                                    th:data-email="${user.email}"
                                                    th:data-role-ids-id="'editRolesIds_' + ${user.id}">
                                                Edit
                                            </button>
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-sm btn-danger delete-btn"
                                                    th:data-id="${user.id}">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Форма добавления нового пользователя -->
                        <div class="tab-pane fade new-user-table" id="new-user" role="tabpanel">
                            <div class="content-block no-gap">
                                <form th:action="@{/admin/users}" method="post" th:object="${newUser}">
                                    <table class="custom-table">
                                        <thead>
                                        <tr>
                                            <th colspan="1" class="table-caption-cell">
                                                <div class="caption-content"><h4 class="mb-2">Add new user</h4>
                                                    <div class="thin-divider"></div>
                                                </div>
                                            </th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr>
                                            <td class="form-field-cell"><label>First Name</label><label>
                                                <input type="text" class="form-control" th:field="*{firstName}"
                                                       placeholder="first name" required>
                                            </label></td>
                                        </tr>
                                        <tr>
                                            <td class="form-field-cell"><label>Last Name</label><label>
                                                <input type="text" class="form-control" th:field="*{lastName}"
                                                       placeholder="last name" required>
                                            </label></td>
                                        </tr>
                                        <tr>
                                            <td class="form-field-cell"><label>Age</label><label>
                                                <input type="number" class="form-control" th:field="*{age}"
                                                       placeholder="age" min="1" max="150" required>
                                            </label></td>
                                        </tr>
                                        <tr>
                                            <td class="form-field-cell"><label>Email</label><label>
                                                <input type="email" class="form-control" th:field="*{email}"
                                                       placeholder="email" required>
                                            </label></td>
                                        </tr>
                                        <tr>
                                            <td class="form-field-cell"><label>Password</label><label>
                                                <input type="password" class="form-control" th:field="*{password}"
                                                       placeholder="password" required>
                                            </label></td>
                                        </tr>
                                        <tr>
                                            <td class="form-field-cell"><label>Role</label><label>
                                                <select name="roles" multiple class="form-select" required>
                                                    <option th:each="role : ${roles}" th:value="${role.id}"
                                                            th:text="${role.role}"></option>
                                                </select>
                                            </label>
                                                <div class="note" style="font-size: 0.8rem; margin-top: 0.3rem;"></div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="text-center pt-2 pb-2">
                                                <button type="submit" class="btn btn-success">Add new user</button>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="v-pills-profile">
                    <div class="content-block"><h3 class="fw-bold mb-4" style="font-size: 2.5rem;">User information -
                        page</h3></div>
                    <div class="content-block no-gap user-profile-table">
                        <table class="custom-table">
                            <thead>
                            <tr>
                                <th colspan="6" class="table-caption-cell">
                                    <div class="caption-content"><h4 class="mb-2">About user</h4>
                                        <div class="thin-divider"></div>
                                    </div>
                                </th>
                            </tr>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td th:text="${currentUser.id}"></td>
                                <td th:text="${currentUser.firstName}"></td>
                                <td th:text="${currentUser.lastName}"></td>
                                <td th:text="${currentUser.age}"></td>
                                <td th:text="${currentUser.email}"></td>
                                <td>
                                    <th:block th:each="role, iterStat : ${currentUser.roles}"><span
                                            th:text="${role.role.replace('ROLE_', '')}"></span><span
                                            th:if="${!iterStat.last}">, </span></th:block>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editUserForm" method="post">
                <div class="modal-body">
                    <input type="hidden" id="editUserId" name="id">
                    <div class="modal-field-cell"><label>ID</label><label for="editId"></label><input type="text"
                                                                                                      id="editId"
                                                                                                      class="form-control"
                                                                                                      readonly disabled>
                    </div>
                    <div class="modal-field-cell"><label>First Name</label><label for="editFirstName"></label><input
                            type="text" id="editFirstName" name="firstName" class="form-control" required></div>
                    <div class="modal-field-cell"><label>Last Name</label><label for="editLastName"></label><input
                            type="text" id="editLastName" name="lastName" class="form-control" required></div>
                    <div class="modal-field-cell"><label>Age</label><label for="editAge"></label><input type="number"
                                                                                                        id="editAge"
                                                                                                        name="age"
                                                                                                        class="form-control"
                                                                                                        min="1"
                                                                                                        max="150"
                                                                                                        required></div>
                    <div class="modal-field-cell"><label>Email</label><label for="editEmail"></label><input type="email"
                                                                                                            id="editEmail"
                                                                                                            name="email"
                                                                                                            class="form-control"
                                                                                                            required>
                    </div>
                    <div class="modal-field-cell"><label>Password</label><label for="editPassword"></label><input
                            type="password" id="editPassword" name="password" class="form-control"></div>
                    <div class="modal-field-cell"><label>Role</label><label for="editRoles"></label><select
                            id="editRoles" name="roles" multiple class="form-select" required>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.role}"></option>
                    </select><small class="text-muted"></small></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно удаления -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteUserModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteUserForm" method="post">
                <div class="modal-body">
                    <input type="hidden" id="deleteUserId" name="id">
                    <div class="modal-field-cell"><label>ID</label><label for="deleteId"></label><input type="text"
                                                                                                        id="deleteId"
                                                                                                        class="form-control"
                                                                                                        readonly
                                                                                                        disabled></div>
                    <div class="modal-field-cell"><label>First Name</label><label for="deleteFirstName"></label><input
                            type="text" id="deleteFirstName" class="form-control" readonly disabled></div>
                    <div class="modal-field-cell"><label>Last Name</label><label for="deleteLastName"></label><input
                            type="text" id="deleteLastName" class="form-control" readonly disabled></div>
                    <div class="modal-field-cell"><label>Age</label><label for="deleteAge"></label><input type="number"
                                                                                                          id="deleteAge"
                                                                                                          class="form-control"
                                                                                                          readonly
                                                                                                          disabled>
                    </div>
                    <div class="modal-field-cell"><label>Email</label><label for="deleteEmail"></label><input
                            type="email" id="deleteEmail" class="form-control" readonly disabled></div>
                    <div class="modal-field-cell"><label>Role</label><label for="deleteRoles"></label><input type="text"
                                                                                                             id="deleteRoles"
                                                                                                             class="form-control"
                                                                                                             readonly
                                                                                                             disabled>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Редактирование
        const editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
        const editForm = document.getElementById('editUserForm');
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                const firstName = this.getAttribute('data-firstname');
                const lastName = this.getAttribute('data-lastname');
                const age = this.getAttribute('data-age');
                const email = this.getAttribute('data-email');
                const roleIdsId = this.getAttribute('data-role-ids-id');

                document.getElementById('editUserId').value = id;
                document.getElementById('editId').value = id;
                document.getElementById('editFirstName').value = firstName;
                document.getElementById('editLastName').value = lastName;
                document.getElementById('editAge').value = age;
                document.getElementById('editEmail').value = email;
                document.getElementById('editPassword').value = '';

                const select = document.getElementById('editRoles');
                for (let i = 0; i < select.options.length; i++) select.options[i].selected = false;

                if (roleIdsId) {
                    const hiddenSpan = document.getElementById(roleIdsId);
                    if (hiddenSpan) {
                        const roleIdsStr = hiddenSpan.innerText.trim();
                        if (roleIdsStr) {
                            const roleIds = roleIdsStr.split(',');
                            for (let i = 0; i < select.options.length; i++) {
                                if (roleIds.includes(select.options[i].value)) {
                                    select.options[i].selected = true;
                                }
                            }
                        }
                    }
                }

                editForm.action = `/admin/users/${id}/update`;
                editModal.show();
            });
        });

        // Удаление
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteUserModal'));
        const deleteForm = document.getElementById('deleteUserForm');

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const userId = this.getAttribute('data-id');

                fetch(`/admin/users/${userId}/details`)
                    .then(response => {
                        if (!response.ok) throw new Error('Ошибка загрузки');
                        return response.json();
                    })
                    .then(user => {
                        document.getElementById('deleteUserId').value = user.id;
                        document.getElementById('deleteId').value = user.id;
                        document.getElementById('deleteFirstName').value = user.firstName;
                        document.getElementById('deleteLastName').value = user.lastName;
                        document.getElementById('deleteAge').value = user.age;
                        document.getElementById('deleteEmail').value = user.email;

                        document.getElementById('deleteRoles').value = user.roles?.map(r => r.role.replace('ROLE_', '')).join(', ') || '';

                        deleteForm.action = `/admin/users/${user.id}/delete`;
                        deleteModal.show();
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        alert('Не удалось загрузить данные пользователя');
                    });
            });
        });
    });
</script>
</body>
</html>
