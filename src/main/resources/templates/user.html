<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* стили для левой панели и контента */
    body { background-color: #f5f5f5; }
    .left-sidebar {
      background-color: white;
      min-height: calc(100vh - 56px);
      padding: 40px 0 20px 0;
    }
    .nav-pills { width: 100%; }
    .nav-pills .nav-link {
      background-color: transparent;
      color: #495057;
      margin-bottom: 0;
      text-align: left;
      padding: 12px 20px;
      border-radius: 0;
      width: 100%;
      transition: all 0.2s;
    }
    .nav-pills .nav-link.active {
      background-color: #0d6efd !important;
      color: white;
      border-radius: 0;
    }
    .right-content {
      background-color: #f5f5f5;
      min-height: calc(100vh - 56px);
      padding: 50px;
    }
    .content-block {
      max-width: 95%;
      margin: 0 auto;
    }
    .custom-table {
      border: 1px solid #dee2e6 !important;
      background-color: white;
      border-collapse: collapse;
      width: 100%;
    }
    .custom-table th, .custom-table td {
      border: none;
      padding: 12px 8px;
      vertical-align: middle;
    }
    .custom-table thead th {
      border-bottom: 2px solid #dee2e6;
      background-color: white;
    }
    .custom-table tbody tr {
      border-bottom: 1px solid #f0f0f0;
    }
    .custom-table tbody tr:nth-child(odd) td {
      background-color: #f8f9fa;
    }
    .table-caption-cell {
      padding: 12px 15px 0 15px !important;
      border-bottom: none !important;
    }
    .caption-content h4 {
      margin: 0 0 12px 0;
      font-weight: 500;
      color: #212529;
    }
    .thin-divider {
      width: calc(100% - 15px);
      margin: 0 auto;
      border-top: 1px solid #dee2e6;
    }
    .user-profile-table .table-caption-cell {
      background-color: #e9ecef;
    }
    .user-profile-table .thin-divider {
      width: 100% !important;
    }
    .logout-btn-custom {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .logout-btn-custom:hover {
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
<div class="container-fluid p-0">
  <!-- Верхняя панель с информацией о текущем пользователе и кнопкой Logout -->
  <div class="p-3 bg-dark text-white d-flex justify-content-between align-items-center">
    <div>
      <span class="fw-bold fs-4" th:text="${currentUser != null ? currentUser.email : 'user@example.com'}">user@example.com</span>
      <span class="fs-4"> with roles:</span>
      <span th:if="${currentUser != null and currentUser.roles != null}" class="ms-2 fs-4">
        <th:block th:each="role, iterStat : ${currentUser.roles}">
          <span th:text="${role.role.replace('ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
        </th:block>
      </span>
    </div>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-link p-0 fw-bold fs-5 logout-btn-custom">Logout</button>
    </form>
  </div>
</div>

<div class="container-fluid p-0">
  <div class="row g-0">
    <!-- Левая панель с единственной вкладкой User -->
    <div class="col-md-3 left-sidebar">
      <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
        <button class="nav-link active" id="v-pills-profile-tab" data-bs-toggle="pill" data-bs-target="#v-pills-profile"
                type="button" role="tab">User</button>
      </div>
    </div>

    <!-- Правая панель с информацией о пользователе -->
    <div class="col-md-9 right-content">
      <div class="tab-content">
        <div class="tab-pane fade show active" id="v-pills-profile">
          <div class="content-block">
            <h3 class="fw-bold mb-4" style="font-size: 2.5rem;">User information - page</h3>
          </div>
          <div class="content-block no-gap user-profile-table">
            <table class="custom-table">
              <thead>
              <tr>
                <th colspan="6" class="table-caption-cell">
                  <div class="caption-content">
                    <h4 class="mb-2">About user</h4>
                    <div class="thin-divider"></div>
                  </div>
                </th>
              </tr>
              <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
              </tr>
              </thead>
              <tbody>
              <tr>
                <td th:text="${currentUser.id}"></td>
                <td th:text="${currentUser.firstName}"></td>
                <td th:text="${currentUser.lastName}"></td>
                <td th:text="${currentUser.age}"></td>
                <td th:text="${currentUser.email}"></td>
                <td>
                  <th:block th:each="role, iterStat : ${currentUser.roles}">
                    <span th:text="${role.role.replace('ROLE_', '')}"></span><span th:if="${!iterStat.last}">, </span>
                  </th:block>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
