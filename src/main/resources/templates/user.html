<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <style>
        body { font-family: Arial,serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .logout-form { position: absolute; top: 20px; right: 20px; }
        .logout-btn { background: #f44336; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 3px; }
        .btn { padding: 10px 20px; border: none; cursor: pointer; border-radius: 3px; text-decoration: none; display: inline-block; }
        .btn-admin { background-color: #4CAF50; color: white; }
        .footer-buttons { margin-top: 20px; text-align: left; }


        .header-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }

        .user-info-inline {
            background-color: #e8f5e8;
            padding: 8px 15px;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }

        .user-info-inline .label {
            font-weight: bold;
            color: #2e7d32;
        }

        .user-info-inline .email {
            color: #1976D2;
            font-weight: 500;
        }

        .user-info-inline .roles-container {
            color: #7b1fa2;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .user-info-inline .separator {
            color: #4CAF50;
            font-weight: bold;
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="logout-form">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

<div class="header-container">
    <h1>User Profile</h1>

    <!-- Информация о текущем пользователе в одну строку -->
    <div class="user-info-inline" th:if="${user != null}">
        <span class="label">Logged in:</span>
        <span class="email" th:text="${user.email}">user@mail.ru</span>
        <span class="separator">|</span>
        <span class="label">Roles:</span>
        <!-- Перебираем роли в цикле и объединяем через запятую -->
        <span class="roles-container">
            <th:block th:each="role, iterStat : ${user.roles}">
                <span th:text="${role.role}"></span><span th:if="${!iterStat.last}">, </span>
            </th:block>
        </span>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Roles</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.email}"></td>
        <td>
            <span th:each="role : ${user.roles}" th:text="${role.role} + ' '"></span>
        </td>
    </tr>
    </tbody>
</table>

<!-- Кнопка внизу слева, показывается только если у пользователя есть роль ADMIN -->
<div class="footer-buttons" th:if="${isAdmin}">
    <a href="/admin" class="btn btn-admin">Back to Admin Panel</a>
</div>

</body>
</html>
