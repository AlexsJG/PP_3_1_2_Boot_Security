<!DOCTYPE html>
<<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .logout-form {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 3px;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group select {
            padding: 8px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .form-group select {
            width: 266px;
            height: 100px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 3px;
            text-decoration: none;
            display: inline-block;
            margin: 0 5px;
            font-size: 14px;
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
        }

        .btn-save:hover {
            background-color: #45a049;
        }

        .btn-cancel {
            background-color: #f44336;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #d32f2f;
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 30px;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        .note {
            color: #666;
            font-size: 12px;
            margin-left: 105px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="logout-form">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

<div class="form-container">
    <h2>Edit User</h2>

    <form th:action="@{/admin/users/{id}/update(id=${user.id})}" th:object="${user}" method="post">
        <div class="form-group">
            <label>First Name:</label>
            <label>
                <input type="text" th:field="*{firstName}" placeholder="Enter first name" required/>
            </label>
        </div>

        <div class="form-group">
            <label>Last Name:</label>
            <label>
                <input type="text" th:field="*{lastName}" placeholder="Enter last name" required/>
            </label>
        </div>

        <div class="form-group">
            <label>Age:</label>
            <label>
                <input type="number" th:field="*{age}" placeholder="Enter age" required min="1" max="150"/>
            </label>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <label>
                <input type="email" th:field="*{email}" placeholder="Enter email" required/>
            </label>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <label>
                <input type="password" name="password" placeholder="Leave empty to keep current password"/>
            </label>
        </div>

        <div class="form-group">
            <label>Roles:</label>
            <label>
                <select name="roles" multiple required>
                    <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.role}"
                            th:selected="${user.roles.contains(role)}"></option>
                </select>
            </label>
            <div class="note">Hold Ctrl/Cmd to select multiple roles</div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-save">Save Changes</button>
            <a href="/admin" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
